name: Generate subscriptions

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Xray
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xray.zip" https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q -o "$RUNNER_TEMP/xray.zip" xray -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          "$RUNNER_TEMP/xray/xray" version
          echo "XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Generate subscriptions
        env:
          HEALTH_REQUIRE_XRAY: "1"
          RU_HOP_CONFIG: ${{ secrets.RU_HOP_CONFIG }}
        run: npm run generate

      - name: Commit generated files
        run: |
          git config user.name "claude"
          git config user.email "claude@users.noreply.github.com"
          git add output/ servers/free/
          git diff --cached --quiet || git commit -m "chore: update generated subscriptions"
          git pull --rebase origin main
          git push
