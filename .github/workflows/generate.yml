name: Generate subscriptions

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate subscriptions
        run: npm run generate
        env:
          FREE_UPSTREAM_URL: ${{ secrets.FREE_UPSTREAM_URL }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ servers/free/
          git diff --cached --quiet || git commit -m "chore: update generated subscriptions"
          git pull --rebase origin main
          git push
